    <script>
      // Suppress benign iframe/preview WebSocket disconnect error events from triggering runtime overlays
      window.addEventListener(
        'error',
        function (event) {
          if (
            event?.message?.toLowerCase().includes('websocket') ||
            (event?.target && event.target instanceof WebSocket) ||
            (event?.error && String(event.error).toLowerCase().includes('websocket'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        },
        true
      );
      window.addEventListener(
        'unhandledrejection',
        function (event) {
          if (
            event?.reason?.message?.toLowerCase().includes('websocket') ||
            String(event?.reason).toLowerCase().includes('websocket')
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        },
        true
      );
    </script>
